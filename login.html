<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Sign Up</title>
		<link rel="stylesheet" href="css/style.css">
	</head>
	
	<body>
		<div id="lorg">
			<div id="smol">
				<table>
					<form>
						<tr>
							<td colspan="2">
								<p id="ttl">LOG IN</p>
							</td>
						</tr>
						
						<tr>
							<td>
								<p class="boldtxt">Username:</p>
								<input class="input" type="text" name="usr"><br>
								<label class="smalltxt">Enter your username!</label>
							</td>
							<td>
								<p class="boldtxt">Password:</p>
								<input class="input" type="password" name="pswd"><br>
								<label class="smalltxt">Enter your password!</label>
							</td>
						</tr>
						
						<tr>
							<td colspan="2">
								<p class="boldtxt">Forgot your password?</p>
								<input type="email" id="email" name="email" placeholder="example@example.com"><br>
								<label class="smalltxt">Please enter a valid email to recover your password.</label>
							</td>
						</tr>
						
						<tr>
							<td colspan="2">
								<input class="btn" type="button" name="enter" value="ENTER">
							</td>
						</tr>
						
						<tr>
							<td colspan="2">
								<p class="bottom">If you don't have an account, <a href="index.html" target="_blank">click here</a> to create one!</p>
							</td>
						</tr>
					</form>
				</table>
			</div>
		</div>
	</body>
</html>
